<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singles Qualifiers &middot; South Portland Metro APA</title>
<meta name="description" content="Register for South Portland Metro APA singles qualifiers.">
<link rel="icon" href="favicon.svg">
<style>
  :root{--red:#ea002a;--blue:#0031a1;--ink:#15171a;--mut:#5b6169;--bg:#f5f6f8;--card:#fff;--line:#e3e6ea;--ok:#0a7d32}
  @media (prefers-color-scheme:dark){:root{--ink:#f2f4f7;--mut:#a7aeb6;--bg:#121417;--card:#1b1e22;--line:#2b3037;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:660px;margin:0 auto;padding:16px 16px 56px}
  header{text-align:center;padding:22px 0 8px}
  .bar{height:4px;width:60px;margin:0 auto 16px;background:linear-gradient(90deg,var(--red),var(--blue));border-radius:2px}
  h1{margin:0 0 4px;font-size:1.45rem;letter-spacing:-.02em}
  .sub{margin:0;color:var(--mut);font-size:.95rem}
  h2{margin:26px 0 10px;font-size:1.05rem;letter-spacing:.02em;text-transform:uppercase;color:var(--mut)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px}
  .q.on{border-color:var(--ok)}
  .qt{font-weight:650;margin:0 0 2px}
  .qm{color:var(--mut);font-size:.9rem;margin:0 0 2px}
  .fee{color:var(--mut);font-size:.85rem;margin:0}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button{font:inherit;font-weight:650;border:0;border-radius:9px;padding:12px 18px;min-height:46px;cursor:pointer}
  .reg{background:var(--red);color:#fff;flex:1}
  .reg:hover{filter:brightness(1.07)}
  .unreg{background:transparent;color:var(--mut);border:1px solid var(--line)}
  .badge{color:var(--ok);font-weight:650;font-size:.92rem}
  button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  dialog{border:0;border-radius:14px;padding:0;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .dlg{padding:22px}
  .dlg h3{margin:0 0 4px;font-size:1.1rem}
  .dlg p.for{margin:0 0 16px;color:var(--mut);font-size:.9rem}
  label{display:block;font-size:.82rem;color:var(--mut);margin:10px 0 4px;font-weight:600}
  input{width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  .err{color:var(--red);font-size:.88rem;margin:10px 0 0;min-height:1.1em}
  .note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--mut);font-size:.88rem;margin:18px 0 0}
  footer{text-align:center;color:var(--mut);font-size:.8rem;margin-top:30px}
  .empty{color:var(--mut);text-align:center;padding:26px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar"></div>
    <h1>Singles Qualifiers</h1>
    <p class="sub">South Portland Metro APA &middot; play till you win</p>
  </header>

  <div id="list"><p class="empty">Loading qualifiers&hellip;</p></div>

  <p class="note" id="note" hidden>
    Walk-ins are welcome &mdash; registering just helps us plan boards and have your
    paperwork ready. Pay at the door, cash or Venmo.
  </p>

  <footer>South Portland Metro APA</footer>
</div>

<dialog id="dlg"><form method="dialog" class="dlg" id="frm">
  <h3>Register</h3>
  <p class="for" id="dfor"></p>
  <label for="f_apa">APA member number</label>
  <input id="f_apa" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="e.g. 12345678">
  <label for="f_first">First name</label>
  <input id="f_first" autocomplete="given-name" maxlength="60">
  <label for="f_last">Last name</label>
  <input id="f_last" autocomplete="family-name" maxlength="60">
  <label for="f_email">Email (for your confirmation and calendar invite)</label>
  <input id="f_email" type="email" inputmode="email" autocomplete="email" maxlength="120">
  <p class="err" id="derr"></p>
  <div class="row">
    <button class="reg" id="go" type="button">Register</button>
    <button class="unreg" id="cancelbtn" type="button">Close</button>
  </div>
</form></dialog>

<script>
// ───────────────────────────────────────────────────────────────────────────
// Open registration. No login, no session, no server-side identity lookup.
// Everything the server learns is what the player typed into this dialog.
//
// localStorage holds two things:
//   spm-sq-me    their details, so the dialog is prefilled next time
//   spm-sq-regs  { eventId: cancelToken } so this device can show + undo
// It is per-device by nature, which is why the cancel token also travels in
// the confirmation email: switch phones or clear site data and the emailed
// link still works. localStorage is a convenience, never the only route.
// Every read/write is wrapped — storage throws in some private modes.
// ───────────────────────────────────────────────────────────────────────────
var GAS = "https://script.google.com/macros/s/AKfycbzGTzkBRTrIIP_tD6sbtOOUmNZkXDdtxPoO4c8fdWt5h3tZFueNSISPv8Q3LWStx73Whw/exec";
var K_ME = 'spm-sq-me', K_REGS = 'spm-sq-regs';
var FMT = { '8': '8-Ball', '9': '9-Ball' };

function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function post(payload) {
  return fetch(GAS, { method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // never application/json: CORS preflight GAS cannot answer
    body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
}

function fmtWhen(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/Los_Angeles' })
       + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' });
}

var EVENTS = [], DLG = document.getElementById('dlg'), CURRENT = null;

function render() {
  var regs = lsGet(K_REGS, {}), host = document.getElementById('list');
  if (!EVENTS.length) { host.innerHTML = '<p class="empty">No qualifiers are scheduled right now.</p>'; return; }
  document.getElementById('note').hidden = false;

  var groups = {};
  EVENTS.forEach(function (e) { (groups[e.format] = groups[e.format] || []).push(e); });

  host.innerHTML = Object.keys(groups).sort().map(function (f) {
    return '<h2>' + (FMT[f] || f) + '</h2>' + groups[f].map(function (e) {
      var on = !!regs[e.id];
      return '<div class="q' + (on ? ' on' : '') + '">'
        + '<p class="qt">' + esc(fmtWhen(e.starts_at)) + '</p>'
        + '<p class="qm">' + esc(e.venue_name || '') + (e.venue_address ? ' &middot; ' + esc(e.venue_address) : '') + '</p>'
        + '<p class="fee">$' + (e.entry_fee || 0) + ' entry + $' + (e.greens_fee || 0) + ' greens = $'
        + ((+e.entry_fee || 0) + (+e.greens_fee || 0)) + ' &middot; qualifies for ' + esc(e.regionals_season || '') + '</p>'
        + '<div class="row">'
        + (on ? '<span class="badge">&#10003; You are registered</span>'
                + '<button class="unreg" data-un="' + e.id + '">Unregister</button>'
              : '<button class="reg" data-reg="' + e.id + '">Register</button>')
        + '</div></div>';
    }).join('');
  }).join('');
}
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

document.addEventListener('click', function (ev) {
  var r = ev.target.getAttribute && ev.target.getAttribute('data-reg');
  var u = ev.target.getAttribute && ev.target.getAttribute('data-un');
  if (r) openDialog(+r);
  if (u) doCancel(+u);
});

function openDialog(eventId) {
  CURRENT = EVENTS.filter(function (e) { return e.id === eventId; })[0];
  if (!CURRENT) return;
  var me = lsGet(K_ME, {});
  document.getElementById('f_apa').value = me.member_number || '';
  document.getElementById('f_first').value = me.first_name || '';
  document.getElementById('f_last').value = me.last_name || '';
  document.getElementById('f_email').value = me.email || '';
  document.getElementById('derr').textContent = '';
  document.getElementById('dfor').textContent = (FMT[CURRENT.format] || CURRENT.format) + ' \u2014 ' + fmtWhen(CURRENT.starts_at);
  document.getElementById('go').textContent = 'Register';
  document.getElementById('go').disabled = false;
  DLG.showModal();
}
document.getElementById('cancelbtn').addEventListener('click', function () { DLG.close(); });

document.getElementById('go').addEventListener('click', function () {
  var btn = this, err = document.getElementById('derr');
  var me = {
    member_number: document.getElementById('f_apa').value.replace(/[^0-9]/g, ''),
    first_name: document.getElementById('f_first').value.trim(),
    last_name: document.getElementById('f_last').value.trim(),
    email: document.getElementById('f_email').value.trim()
  };
  if (!/^[0-9]{5,9}$/.test(me.member_number)) { err.textContent = 'Please enter your APA member number (digits only).'; return; }
  if (!me.first_name || !me.last_name) { err.textContent = 'Please enter your first and last name.'; return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(me.email)) { err.textContent = 'Please enter a valid email address.'; return; }

  lsSet(K_ME, me);                       // remembered for next time, edits included
  btn.disabled = true; btn.textContent = 'Registering\u2026'; err.textContent = '';

  post({ action: 'sq_register', event_id: CURRENT.id, member_number: me.member_number,
         first_name: me.first_name, last_name: me.last_name, email: me.email })
    .then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || 'Could not register.');
      var regs = lsGet(K_REGS, {}); regs[CURRENT.id] = j.token; lsSet(K_REGS, regs);
      DLG.close(); render();
    })
    .catch(function (e) {
      btn.disabled = false; btn.textContent = 'Register';
      err.textContent = e.message || 'Could not register. Please try again.';
    });
});

function doCancel(eventId) {
  var regs = lsGet(K_REGS, {}), token = regs[eventId];
  if (!token) return;
  post({ action: 'sq_cancel', token: token }).then(function (j) {
    // A token the server rejects is stale — drop it locally either way, or the
    // card is stuck showing "registered" forever with no way out.
    delete regs[eventId]; lsSet(K_REGS, regs); render();
    if (!j || !j.ok) alert('We could not confirm that cancellation. If you still get a reminder, reply to the confirmation email.');
  }).catch(function () {
    alert('Could not reach the server. Please try again in a moment.');
  });
}

// Cancel link arriving from the confirmation email — works on any device.
(function handleEmailCancel() {
  var m = location.search.match(/[?&]cancel=([^&]+)/);
  if (!m) return;
  var token = decodeURIComponent(m[1]);
  history.replaceState({}, '', location.pathname);       // keep the token out of history
  post({ action: 'sq_cancel', token: token }).then(function (j) {
    var regs = lsGet(K_REGS, {});
    Object.keys(regs).forEach(function (k) { if (regs[k] === token) delete regs[k]; });
    lsSet(K_REGS, regs);
    alert(j && j.ok ? 'You have been unregistered. A calendar update is on its way.'
                    : 'That cancellation link is no longer valid — you may already be unregistered.');
    render();
  });
})();

post({ action: 'sq_events' })
  .then(function (j) { EVENTS = (j && j.ok && j.events) || []; render(); })
  .catch(function () { document.getElementById('list').innerHTML = '<p class="empty">Could not load qualifiers. Please refresh.</p>'; });
</script>
</body>
</html>
